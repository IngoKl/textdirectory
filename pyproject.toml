[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "textdirectory"
dynamic = ["version"]
description = "Aggregate multiple text files into one, with filters and transformations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ingo Kleiber", email = "ingo@kleiber.me" }]
requires-python = ">=3.10"
keywords = ["text", "corpus", "aggregation", "nlp", "textdirectory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.1",
    "tqdm>=4.64",
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "lxml>=4.9",
    "ftfy>=6.1",
]

[project.optional-dependencies]
# The en_core_web_sm model cannot be declared as a dependency (it is not on
# PyPI); install it with: python -m spacy download en_core_web_sm
nlp = [
    "spacy>=3.8,<4",
    "psutil>=5.9",
]

[project.scripts]
textdirectory = "textdirectory.cli:main"

[project.urls]
Homepage = "https://github.com/IngoKl/textdirectory"
Documentation = "https://textdirectory.readthedocs.io"
Repository = "https://github.com/IngoKl/textdirectory"
Issues = "https://github.com/IngoKl/textdirectory/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "responses>=0.25",
    "ruff>=0.8",
    "mypy>=1.13",
]
docs = [
    "sphinx>=7",
    "furo",
    "myst-parser",
]

[tool.hatch.version]
path = "src/textdirectory/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/textdirectory"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "docs",
    "examples",
    "README.md",
    "CHANGELOG.md",
    "AUTHORS.md",
    "CONTRIBUTING.md",
    "LICENSE",
]
exclude = ["docs/_build"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "C4"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not network'"
markers = [
    "network: hits live external services (deselected by default; run with -m network)",
    "nlp: requires spacy and the en_core_web_sm model (auto-skipped when missing)",
]

[tool.coverage.run]
branch = true
source_pkgs = ["textdirectory"]

[tool.coverage.paths]
source = ["src/textdirectory", "*/site-packages/textdirectory"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.10"
files = ["src/textdirectory"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["spacy.*", "ftfy.*", "bs4.*", "lxml.*", "psutil.*", "tqdm.*", "requests.*", "en_core_web_sm.*"]
ignore_missing_imports = true
follow_imports = "skip"

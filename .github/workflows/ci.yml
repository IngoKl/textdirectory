name: CI

on:
  push:
    branches: [master, modernize, 'dev-*']
  pull_request:
  schedule:
    # Weekly run that also exercises the network-marked tests
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --group dev
      - name: Ruff lint
        run: uv run ruff check src tests
      - name: Ruff format
        run: uv run ruff format --check src tests
      - name: Mypy
        run: uv run mypy

  test-core:
    # No nlp extra installed: proves the package imports and works without spaCy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (core only)
        run: uv sync --group dev
      - name: Import smoke test
        run: uv run python -c "import textdirectory, textdirectory.transformations, textdirectory.cli"
      - name: Run tests
        run: uv run pytest --cov --cov-report=xml
      - name: CLI smoke test
        run: uv run textdirectory --version

  test-nlp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Install dependencies (with nlp extra)
        run: uv sync --group dev --extra nlp
      - name: Install the spaCy model
        run: uv pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
      - name: Run tests
        run: uv run pytest --cov --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-nlp
          path: coverage.xml

  test-network:
    # Live external services (UCREL USAS): never gates merges
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run network-marked tests
        run: uv run pytest -m network

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Build sdist and wheel
        run: uv build
      - name: Check the distribution
        run: uvx twine check dist/*
      - name: Verify wheel contents
        run: |
          uv run python -m zipfile -l dist/*.whl | grep 'data/stopwords/stopwords_en.txt'
          uv run python -m zipfile -l dist/*.whl | grep 'data/language_models/crudesc_lm_en.gz.lm'
          ! uv run python -m zipfile -l dist/*.whl | grep 'testdata'
